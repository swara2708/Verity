<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verity — Bias-Aware 360° Review Intelligence System</title>
    <meta name="description" content="Verity drafts bias-aware 360-degree performance reviews, traces every claim to real evidence, and flags what it cannot verify before a manager approves it." />
    <link rel="canonical" href="https://verity-performance.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Verity" />
    <meta property="og:title" content="Verity — Bias-Aware 360° Review Intelligence System" />
    <meta property="og:description" content="Verity drafts bias-aware 360-degree performance reviews, traces every claim to real evidence, and flags what it cannot verify before a manager approves it." />
    <meta property="og:url" content="https://verity-performance.app/" />
    <meta property="og:image" content="https://verity-performance.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Verity — Bias-Aware 360° Review Intelligence System" />
    <meta name="twitter:description" content="Verity drafts bias-aware 360-degree performance reviews, traces every claim to real evidence, and flags what it cannot verify before a manager approves it." />
    <meta name="twitter:image" content="https://verity-performance.app/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Verity",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Verity drafts bias-aware 360-degree performance reviews, traces every claim to real evidence, and flags what it cannot verify before a manager approves it.",
        "url": "https://verity-performance.app/",
        "featureList": [
          "evidence-backed claim verification",
          "deterministic bias scoring",
          "human approval workflow",
          "full audit trail",
          "role-based multi-tenant access"
        ]
      }
    </script>
    <meta name="build" content="v3-stable" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
